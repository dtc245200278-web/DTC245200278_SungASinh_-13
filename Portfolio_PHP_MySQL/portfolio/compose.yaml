
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./uploads:/var/www/html/uploads
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web_net
      - db_net

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - db_net

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: ${DB_HOST:?Set DB_HOST in .env}
      PMA_PORT: ${DB_PORT:?Set DB_PORT in .env}
    depends_on:
      - db
    networks:
      - db_net

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - web_net
      - monitor_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command:
      - "--nginx.scrape-uri=http://nginx/nginx_status"
    depends_on:
      - nginx
    mem_limit: 64m
    networks:
      - monitor_net

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=metrics"
    env_file:
      - ./monitoring/mysql/exporter.env
    depends_on:
      - db
    mem_limit: 64m
    networks:
      - db_net
      - monitor_net

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--storage.tsdb.retention.size=256MB"
    mem_limit: 256m
    depends_on:
      - nginx-exporter
      - mysql-exporter
    networks:
      - monitor_net

  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    mem_limit: 256m
    depends_on:
      - prometheus
    networks:
      - monitor_net

  loki:
    image: grafana/loki:3.5.5
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - monitor_net

  promtail:
    image: grafana/promtail:3.5.5
    command:
      - "-config.file=/etc/promtail/promtail-config.yaml"
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - monitor_net

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

networks:
  web_net:
    external: true
    name: web_net_DTC245200278
  db_net:
    external: true
    name: db_net_DTC245200278
  monitor_net:
    external: true
    name: monitor_net_DTC245200278
